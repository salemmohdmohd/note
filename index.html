<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>Notes</title>
<meta name="description" content="A static markdown note and reading library.">
<meta name="theme-color" content="#fbfaf8" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#16181d" media="(prefers-color-scheme: dark)">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%234f6bed'/%3E%3Cg stroke='white' stroke-width='2.6' stroke-linecap='round'%3E%3Cpath d='M9 10h14M9 16h14M9 22h9'/%3E%3C/g%3E%3C/svg%3E">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<a class="skip-link" href="#note">Skip to note</a>

<header class="topbar">
  <button id="menu-toggle" class="icon-btn" type="button" aria-label="Show notes list" aria-expanded="false" aria-controls="sidebar">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
  </button>

  <a class="brand" href="#/" title="Home">
    <svg class="brand-mark" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 5h14M5 12h14M5 19h8"/></svg>
    <span class="brand-text">Notes</span>
  </a>

  <div class="search-field">
    <svg class="search-icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="6.5"/><path d="M16 16l4.5 4.5"/></svg>
    <input id="search" type="search" placeholder="Search titles and folders" autocomplete="off" spellcheck="false" aria-label="Search notes by title and folder">
    <button id="search-clear" class="search-clear" type="button" aria-label="Clear search" hidden>
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 7l10 10M17 7L7 17"/></svg>
    </button>
  </div>

  <button id="theme-toggle" class="icon-btn" type="button" aria-label="Switch colour theme" title="Switch colour theme">
    <svg class="icon-sun" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4.2"/><path d="M12 3v2M12 19v2M3 12h2M19 12h2M5.6 5.6l1.4 1.4M17 17l1.4 1.4M18.4 5.6L17 7M7 17l-1.4 1.4"/></svg>
    <svg class="icon-moon" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 14.5A8.2 8.2 0 019.5 4a8.5 8.5 0 1010.5 10.5z"/></svg>
  </button>
</header>

<div class="layout">
  <div id="scrim" class="scrim" hidden></div>

  <aside id="sidebar" class="sidebar">
    <nav id="tree" class="tree" aria-label="Notes">
      <p class="tree-status">Loading notes…</p>
    </nav>
    <footer class="sidebar-footer">
      <a id="new-note" class="new-note" href="#/" target="_blank" rel="noopener noreferrer"
         title="Create a new .md file on GitHub">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
        <span>New note</span>
      </a>
      <div class="sidebar-status">
        <span id="note-count" class="note-count"></span>
        <button id="refresh" class="text-btn" type="button" title="Check the repository for new notes">Refresh</button>
      </div>
    </footer>
  </aside>

  <main class="main" id="main">
    <article id="note" class="note prose" tabindex="-1"></article>
  </main>
</div>

<noscript>
  <p class="noscript">This reader renders markdown in the browser, so JavaScript needs to be enabled.
  You can still read every note directly in the <code>notes/</code> folder of the repository.</p>
</noscript>

<script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"
        integrity="sha384-/TQbtLCAerC3jgaim+N78RZSDYV7ryeoBCVqTuzRrFec2akfBkHS7ACQ3PQhvMVi"
        crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/dompurify@3.1.5/dist/purify.min.js"
        integrity="sha384-nszIONF2FGC59kn+pPFaRa6WUNGwsZgXZiJxJwQbym+TzcH7smolUviLgpPbNx7V"
        crossorigin="anonymous"></script>
<script src="js/config.js"></script>
<script src="js/notes.js"></script>
<script src="js/render.js"></script>
<script src="js/app.js"></script>
</body>
</html>
